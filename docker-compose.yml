services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fifa_world_cup
      POSTGRES_USER: fifa
      POSTGRES_PASSWORD: fifa_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://fifa:fifa_password@db:5432/fifa_world_cup
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata:
